name: Code Quality Checks

on:
  workflow_dispatch:
  # Weekly, so a new advisory or a broken dependency shows up without a push.
  schedule:
    - cron: '10 4 * * 1'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v4.2.0
    with:
      # Measured MSI 86.06 % / covered MSI 86.06 % (2246 mutants, unit suite) on 2026-11-21 UTC, minus a margin for noise.
      infection-min-msi: 84
      infection-min-covered-msi: 84

  # Generated rules are checked by the real promtool (ruling 10); the reusable job may run without Docker.
  promtool:
    name: Validate generated Prometheus rules with promtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        env:
          COMPOSER: composer-ci.json
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the promtool tests
        run: make test-promtool

  # Generated Alertmanager files are checked by the real amtool; the reusable job may run without Docker.
  amtool:
    name: Validate generated Alertmanager files with amtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        env:
          COMPOSER: composer-ci.json
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the amtool tests
        run: make test-amtool
