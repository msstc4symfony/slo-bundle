groups:
  - interval: 1m
    name: slo-checkout.pay
    rules:
      - alert: SloErrorBudgetBurn
        annotations:
          summary: 'SLO checkout.pay availability burns its error budget fast (target 99.9%, window 30d)'
        expr: '(slo:error_ratio:rate1h{application="shop",slo="checkout.pay",objective="availability"} > 0.0144 and slo:error_ratio:rate5m{application="shop",slo="checkout.pay",objective="availability"} > 0.0144) or (slo:error_ratio:rate6h{application="shop",slo="checkout.pay",objective="availability"} > 0.006 and slo:error_ratio:rate30m{application="shop",slo="checkout.pay",objective="availability"} > 0.006)'
        labels:
          application: shop
          objective: availability
          severity: page
          slo: checkout.pay
      - alert: SloErrorBudgetBurn
        annotations:
          summary: 'SLO checkout.pay availability burns its error budget (target 99.9%, window 30d)'
        expr: '(last_over_time(slo:error_ratio:rate3d{application="shop",slo="checkout.pay",objective="availability"}[10m]) > 0.001 and slo:error_ratio:rate6h{application="shop",slo="checkout.pay",objective="availability"} > 0.001) and on() (last_over_time(slo:window:coverage_ratio{application="shop",slo="checkout.pay",objective="availability"}[10m]) >= 1)'
        labels:
          application: shop
          objective: availability
          severity: ticket
          slo: checkout.pay
      - alert: SloErrorBudgetBurn
        annotations:
          summary: 'SLO checkout.pay latency burns its error budget fast (target 99%, window 30d)'
        expr: '(slo:error_ratio:rate1h{application="shop",slo="checkout.pay",objective="latency"} > 0.144 and slo:error_ratio:rate5m{application="shop",slo="checkout.pay",objective="latency"} > 0.144) or (slo:error_ratio:rate6h{application="shop",slo="checkout.pay",objective="latency"} > 0.06 and slo:error_ratio:rate30m{application="shop",slo="checkout.pay",objective="latency"} > 0.06)'
        labels:
          application: shop
          objective: latency
          severity: page
          slo: checkout.pay
      - alert: SloErrorBudgetBurn
        annotations:
          summary: 'SLO checkout.pay latency burns its error budget (target 99%, window 30d)'
        expr: '(last_over_time(slo:error_ratio:rate3d{application="shop",slo="checkout.pay",objective="latency"}[10m]) > 0.01 and slo:error_ratio:rate6h{application="shop",slo="checkout.pay",objective="latency"} > 0.01) and on() (last_over_time(slo:window:coverage_ratio{application="shop",slo="checkout.pay",objective="latency"}[10m]) >= 1)'
        labels:
          application: shop
          objective: latency
          severity: ticket
          slo: checkout.pay
