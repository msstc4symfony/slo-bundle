groups:
  - interval: 1m
    name: slo-checkout.pay
    rules:
      - alert: SloErrorBudgetBurn
        annotations:
          summary: 'SLO checkout.pay availability burns its error budget fast (target 99.9%, window 30d)'
        expr: '(slo:error_ratio:rate1h{slo="checkout.pay",objective="availability"} > 0.0144 and slo:error_ratio:rate5m{slo="checkout.pay",objective="availability"} > 0.0144) or (slo:error_ratio:rate6h{slo="checkout.pay",objective="availability"} > 0.006 and slo:error_ratio:rate30m{slo="checkout.pay",objective="availability"} > 0.006)'
        labels:
          objective: availability
          severity: page
          slo: checkout.pay
      - alert: SloErrorBudgetBurn
        annotations:
          summary: 'SLO checkout.pay availability burns its error budget (target 99.9%, window 30d)'
        expr: '(last_over_time(slo:error_ratio:rate3d{slo="checkout.pay",objective="availability"}[10m]) > 0.001 and slo:error_ratio:rate6h{slo="checkout.pay",objective="availability"} > 0.001) and on() (last_over_time(slo:window:coverage_ratio{slo="checkout.pay",objective="availability"}[10m]) >= 1)'
        labels:
          objective: availability
          severity: ticket
          slo: checkout.pay
      - alert: SloErrorBudgetBurn
        annotations:
          summary: 'SLO checkout.pay latency burns its error budget fast (target 99%, window 30d)'
        expr: '(slo:error_ratio:rate1h{slo="checkout.pay",objective="latency"} > 0.144 and slo:error_ratio:rate5m{slo="checkout.pay",objective="latency"} > 0.144) or (slo:error_ratio:rate6h{slo="checkout.pay",objective="latency"} > 0.06 and slo:error_ratio:rate30m{slo="checkout.pay",objective="latency"} > 0.06)'
        labels:
          objective: latency
          severity: page
          slo: checkout.pay
      - alert: SloErrorBudgetBurn
        annotations:
          summary: 'SLO checkout.pay latency burns its error budget (target 99%, window 30d)'
        expr: '(last_over_time(slo:error_ratio:rate3d{slo="checkout.pay",objective="latency"}[10m]) > 0.01 and slo:error_ratio:rate6h{slo="checkout.pay",objective="latency"} > 0.01) and on() (last_over_time(slo:window:coverage_ratio{slo="checkout.pay",objective="latency"}[10m]) >= 1)'
        labels:
          objective: latency
          severity: ticket
          slo: checkout.pay
