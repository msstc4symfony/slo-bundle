labels:
  application: shop
service: shop
slos:
  - alerting:
      labels:
        application: shop
        objective: availability
        slo: report.export
      name: SloReportExportAvailability
      page_alert:
        labels:
          severity: page
      ticket_alert:
        labels:
          severity: ticket
    description: 'SLO report.export availability, target 99%'
    labels:
      application: shop
      objective: availability
      slo: report.export
    name: report.export-availability
    objective: 99.0
    sli:
      events:
        error_query: '(sum(rate(symfony_slo_events_total{application="shop",component=~"web|worker",slo="report.export",objective="availability",revision="1c380329",result="bad"}[{{.window}}])) or vector(0))'
        total_query: 'sum(rate(symfony_slo_events_total{application="shop",component=~"web|worker",slo="report.export",objective="availability",revision="1c380329"}[{{.window}}]))'
version: prometheus/v1
