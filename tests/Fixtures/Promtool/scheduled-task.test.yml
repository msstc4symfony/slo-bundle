# Unfinished runs of scheduled tasks: cleanup.run (deadline 2m, from its 120s latency) and partners.sync (deadline
# 10m). Runs started in [t-d-r, t-d] minus runs finished in [t-d-r, t] are bad events of every objective (review focus
# 1 and 2). Counters start at 100 as after a restart of Prometheus, so increase() extrapolates; the unfinished runs
# come from instant counter values and are exact. Healthy tasks carry 3 runs killed long ago (started 103).
rule_files:
  - ../Generated/prometheus/slo-recording.rules.yml
  - ../Generated/prometheus/slo-alerts.rules.yml

evaluation_interval: 1m

tests:
  # A run every 10m from 10m, finished 1m later. The spec's literal increase(started[5m] offset 2m) -
  # increase(finished[5m] offset 2m) counts a run started before t-2m and finished after it as unfinished, and three
  # extrapolated increases over windows of different length leave a remainder for every healthy run.
  - name: healthy runs, deadline shorter than the range
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke"}'
        values: '103x9 104x9 105x9 106x9 107x9 108x9 109x9'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",outcome="success"}'
        values: '100x10 101x9 102x9 103x9 104x9 105x9 106x9'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="availability",revision="e16395ab",result="good"}'
        values: '100x10 101x9 102x9 103x9 104x9 105x9 106x9'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="latency",revision="2a2eb2b1",result="good"}'
        values: '100x10 101x9 102x9 103x9 104x9 105x9 106x9'
    promql_expr_test:
      - expr: slo:error_ratio:rate5m{slo="cleanup.run"}
        eval_time: 62m
        exp_samples:
          - labels: 'slo:error_ratio:rate5m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 0
          - labels: 'slo:error_ratio:rate5m{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 0
      - expr: slo:error_ratio:rate30m{slo="cleanup.run"}
        eval_time: 62m
        exp_samples:
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 0
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 0
      - expr: slo:error_ratio:rate1h{slo="cleanup.run"}
        eval_time: 62m
        exp_samples:
          - labels: 'slo:error_ratio:rate1h{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 0
          - labels: 'slo:error_ratio:rate1h{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 0
      - expr: slo:error_ratio:rate6h{slo="cleanup.run"}
        eval_time: 62m
        exp_samples:
          - labels: 'slo:error_ratio:rate6h{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 0
          - labels: 'slo:error_ratio:rate6h{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 0

  # A run every 10m from 10m that takes 5m: it spans several scrapes and the start of the deadline-shifted window.
  - name: healthy runs, deadline longer than the range
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="command:app:sync-partners"}'
        values: '103x9 104x9 105x9 106x9 107x9 108x9 109x9'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="command:app:sync-partners",outcome="success"}'
        values: '100x14 101x9 102x9 103x9 104x9 105x9 106x9'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="partners.sync",objective="availability",revision="e16395ab",result="good"}'
        values: '100x14 101x9 102x9 103x9 104x9 105x9 106x9'
    promql_expr_test:
      - expr: slo:error_ratio:rate5m{slo="partners.sync"}
        eval_time: 57m
        exp_samples:
          - labels: 'slo:error_ratio:rate5m{application="shop",objective="availability",revision="e16395ab",slo="partners.sync",window="30d"}'
            value: 0
      - expr: slo:error_ratio:rate30m{slo="partners.sync"}
        eval_time: 57m
        exp_samples:
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="availability",revision="e16395ab",slo="partners.sync",window="30d"}'
            value: 0
      - expr: slo:error_ratio:rate1h{slo="partners.sync"}
        eval_time: 57m
        exp_samples:
          - labels: 'slo:error_ratio:rate1h{application="shop",objective="availability",revision="e16395ab",slo="partners.sync",window="30d"}'
            value: 0
      - expr: slo:error_ratio:rate6h{slo="partners.sync"}
        eval_time: 57m
        exp_samples:
          - labels: 'slo:error_ratio:rate6h{application="shop",objective="availability",revision="e16395ab",slo="partners.sync",window="30d"}'
            value: 0

  - name: killed run is bad without any finished event
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke"}'
        values: '100x9 101x60'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",outcome="success"}'
        values: '100x70'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="availability",revision="e16395ab",result="good"}'
        values: '100x70'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="latency",revision="2a2eb2b1",result="good"}'
        values: '100x70'
    promql_expr_test:
      - expr: slo:error_ratio:rate5m{slo="cleanup.run"}
        eval_time: 11m
        exp_samples: []
      - expr: slo:error_ratio:rate5m{slo="cleanup.run"}
        eval_time: 13m
        exp_samples:
          - labels: 'slo:error_ratio:rate5m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 1
          - labels: 'slo:error_ratio:rate5m{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 1
      - expr: slo:events:rate5m{slo="cleanup.run",objective="availability"} * 300
        eval_time: 13m
        exp_samples:
          - labels: '{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 1

  # The run starts at 10m and succeeds at 15m, after its 2m deadline: the listener writes no SLO event for it, the
  # step record counted it as unfinished at 12m, so it is one bad event out of one, not two.
  - name: run finishing after its deadline counts once, as unfinished
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke"}'
        values: '100x9 101x60'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",outcome="success"}'
        values: '100x14 101x60'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="availability",revision="e16395ab",result="good"}'
        values: '100x70'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="latency",revision="2a2eb2b1",result="good"}'
        values: '100x70'
    promql_expr_test:
      - expr: slo:error_ratio:rate30m{slo="cleanup.run"}
        eval_time: 30m
        exp_samples:
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 1
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 1
      - expr: slo:events:rate30m{slo="cleanup.run"} * 1800
        eval_time: 30m
        exp_samples:
          - labels: '{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 1
          - labels: '{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 1

  - name: task that always dies reads 100 % bad and covers its window
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke"}'
        values: '0x9 1x60'
    promql_expr_test:
      # [t-d-r, t-d] must lie within the history: the start at 10m counts for 30m windows evaluated from 32m to 41m.
      - expr: slo:error_ratio:rate30m{slo="cleanup.run"}
        eval_time: 35m
        exp_samples:
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 1
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 1
      - expr: slo:window:coverage_ratio{slo="cleanup.run",objective="availability"} > bool 0
        eval_time: 1h
        exp_samples:
          - labels: '{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 1

  - name: run in progress within its deadline is not counted
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke"}'
        values: '100x9 101x9 102x60'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",outcome="success"}'
        values: '100x10 101x60'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="availability",revision="e16395ab",result="good"}'
        values: '100x10 101x60'
    promql_expr_test:
      - expr: slo:error_ratio:rate30m{slo="cleanup.run",objective="availability"}
        eval_time: 21m
        exp_samples:
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 0
      - expr: slo:error_ratio:rate5m{slo="cleanup.run"}
        eval_time: 21m
        exp_samples: []

  # The target is down from 20m to 25m: series missing at one of the instants drop out of the unfinished runs, so
  # the ratio reads the events alone, during and after the gap.
  - name: scrape gap
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke"}'
        values: '100x9 101x9 stale _x4 101x40'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",outcome="success"}'
        values: '100x10 101x8 stale _x4 101x40'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="availability",revision="e16395ab",result="good"}'
        values: '100x10 101x8 stale _x4 101x40'
    promql_expr_test:
      - expr: slo:error_ratio:rate30m{slo="cleanup.run",objective="availability"}
        eval_time: 22m
        exp_samples:
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 0
      - expr: slo:error_ratio:rate30m{slo="cleanup.run",objective="availability"}
        eval_time: 27m
        exp_samples:
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 0
      - expr: slo:error_ratio:rate30m{slo="cleanup.run",objective="availability"}
        eval_time: 33m
        exp_samples:
          - labels: 'slo:error_ratio:rate30m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 0

  - name: retried attempt is not unfinished
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke"}'
        values: '100x9 102x60'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",outcome="retried"}'
        values: '100x10 101x60'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",outcome="error"}'
        values: '0x10 1x60'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="availability",revision="e16395ab",result="bad"}'
        values: '100x10 101x60'
    promql_expr_test:
      - expr: slo:error_ratio:rate5m{slo="cleanup.run",objective="availability"}
        eval_time: 13m
        exp_samples:
          - labels: 'slo:error_ratio:rate5m{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 1

  # Every pod replacement starts new series (instance label); the step record needs only d + 1m of series lifetime,
  # so a task that always dies still reads 100 % bad over windows longer than a pod's life.
  - name: always dying across a pod replacement
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",instance="a"}'
        values: '100 100 100 100 100 100 100 100 100 100 101 101 101 101 101 101 101 101 101 101 102 102 102 102 102 102 102 102 102 102 103 103 103 103 103 103 103 103 103 103 104 104 104 104 104 104 104 104 104 104 105 105 105 105 105 105 105 105 105 105 106 106 106 106 106 106 106 106 106 106 107 107 107 107 107 107 107 107 107 107 108 108 108 108 108 108 108 108 108 108 109 109 109 109 109 109 109 109 109 109 110 110 110 110 110 110 110 110 110 110 111 111 111 111 111 111 111 111 111 111 112 112 112 112 112 112 112 112 112 112 113 113 113 113 113 113 113 113 113 113 114 114 114 114 114 114 114 114 114 114 115 115 115 115 115 115 115 115 115 115 116 116 116 116 116 116 116 116 116 116 117 117 117 117 117 117 117 117 117 117 stale _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _'
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",instance="b"}'
        values: '_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 118 118 118 118 118 118 118 118 118 118 119 119 119 119 119 119 119 119 119 119 120 120 120 120 120 120 120 120 120 120 121 121 121 121 121 121 121 121 121 121 122 122 122 122 122 122 122 122 122 122 123 123 123 123 123 123 123 123 123 123 124 124 124 124 124 124 124 124 124 124 125 125 125 125 125 125 125 125 125 125 126 126 126 126 126 126 126 126 126 126 127 127 127 127 127 127 127 127 127 127 128 128 128 128 128 128 128 128 128 128 129 129 129 129 129 129 129 129 129 129 130 130 130 130 130 130 130 130 130 130 131 131 131 131 131 131 131 131 131 131 132 132 132 132 132 132 132 132 132 132 133 133 133 133 133 133 133 133 133 133 134 134 134 134 134 134 134 134 134 134 135 135 135 135 135 135 135 135 135 135 136 136 136 136 136 136 136 136 136 136 137 137 137 137 137 137 137 137 137 137 138 138 138 138 138 138 138 138 138 138 139 139 139 139 139 139 139 139 139 139 140 140 140 140 140 140 140 140 140 140 141 141 141 141 141 141 141 141 141 141'
    promql_expr_test:
      - expr: slo:error_ratio:rate6h{slo="cleanup.run"}
        eval_time: 370m
        exp_samples:
          - labels: 'slo:error_ratio:rate6h{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 1
          - labels: 'slo:error_ratio:rate6h{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 1
      - expr: slo:sli:ratio{slo="cleanup.run"}
        eval_time: 370m
        exp_samples:
          - labels: 'slo:sli:ratio{application="shop",objective="availability",revision="e16395ab",slo="cleanup.run",window="30d"}'
            value: 0
          - labels: 'slo:sli:ratio{application="shop",objective="latency",revision="2a2eb2b1",slo="cleanup.run",window="30d"}'
            value: 0
