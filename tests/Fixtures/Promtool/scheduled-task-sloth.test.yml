# The Sloth queries of the task SLOs ({{.window}} replaced by 5m, 30m and 1h, error / total) give the same ratios as
# the recording rules on the cases of scheduled-task.test.yml and scheduled-task-resilience.test.yml.
rule_files:
  - sloth-queries.rules.yml

evaluation_interval: 1m

tests:
  - name: healthy runs, deadline shorter than the range
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke"}'
        values: '103 103 103 103 103 103 103 103 103 103 104 104 104 104 104 104 104 104 104 104 105 105 105 105 105 105 105 105 105 105 106 106 106 106 106 106 106 106 106 106 107 107 107 107 107 107 107 107 107 107 108 108 108 108 108 108 108 108 108 108 109 109 109 109 109 109 109 109 109 109'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",outcome="success"}'
        values: '100 100 100 100 100 100 100 100 100 100 100 101 101 101 101 101 101 101 101 101 101 102 102 102 102 102 102 102 102 102 102 103 103 103 103 103 103 103 103 103 103 104 104 104 104 104 104 104 104 104 104 105 105 105 105 105 105 105 105 105 105 106 106 106 106 106 106 106 106 106'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="availability",revision="e16395ab",result="good"}'
        values: '100 100 100 100 100 100 100 100 100 100 100 101 101 101 101 101 101 101 101 101 101 102 102 102 102 102 102 102 102 102 102 103 103 103 103 103 103 103 103 103 103 104 104 104 104 104 104 104 104 104 104 105 105 105 105 105 105 105 105 105 105 106 106 106 106 106 106 106 106 106'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="latency",revision="2a2eb2b1",result="good"}'
        values: '100 100 100 100 100 100 100 100 100 100 100 101 101 101 101 101 101 101 101 101 101 102 102 102 102 102 102 102 102 102 102 103 103 103 103 103 103 103 103 103 103 104 104 104 104 104 104 104 104 104 104 105 105 105 105 105 105 105 105 105 105 106 106 106 106 106 106 106 106 106'
    promql_expr_test:
      - expr: sloth:ratio:rate5m{slo="cleanup.run",objective="availability"}
        eval_time: 62m
        exp_samples:
          - labels: 'sloth:ratio:rate5m{objective="availability",slo="cleanup.run"}'
            value: 0
      - expr: sloth:ratio:rate5m{slo="cleanup.run",objective="latency"}
        eval_time: 62m
        exp_samples:
          - labels: 'sloth:ratio:rate5m{objective="latency",slo="cleanup.run"}'
            value: 0
      - expr: sloth:ratio:rate30m{slo="cleanup.run",objective="availability"}
        eval_time: 62m
        exp_samples:
          - labels: 'sloth:ratio:rate30m{objective="availability",slo="cleanup.run"}'
            value: 0
      - expr: sloth:ratio:rate30m{slo="cleanup.run",objective="latency"}
        eval_time: 62m
        exp_samples:
          - labels: 'sloth:ratio:rate30m{objective="latency",slo="cleanup.run"}'
            value: 0
      - expr: sloth:ratio:rate1h{slo="cleanup.run",objective="availability"}
        eval_time: 62m
        exp_samples:
          - labels: 'sloth:ratio:rate1h{objective="availability",slo="cleanup.run"}'
            value: 0
      - expr: sloth:ratio:rate1h{slo="cleanup.run",objective="latency"}
        eval_time: 62m
        exp_samples:
          - labels: 'sloth:ratio:rate1h{objective="latency",slo="cleanup.run"}'
            value: 0
