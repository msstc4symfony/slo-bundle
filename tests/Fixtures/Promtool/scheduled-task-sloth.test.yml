      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\CleanupTask::__invoke",outcome="success"}'
        values: '100x70'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="availability",revision="e16395ab",result="good"}'
        values: '100x70'
      - series: 'symfony_slo_events_total{application="shop",component="worker",slo="cleanup.run",objective="latency",revision="2a2eb2b1",result="good"}'
        values: '100x70'
    promql_expr_test:
      - expr: sloth:ratio:rate5m{slo="cleanup.run",objective="availability"}
        eval_time: 13m
        exp_samples:
          - labels: 'sloth:ratio:rate5m{objective="availability",slo="cleanup.run"}'
            value: 1
      - expr: sloth:ratio:rate5m{slo="cleanup.run",objective="latency"}
        eval_time: 13m
        exp_samples:
          - labels: 'sloth:ratio:rate5m{objective="latency",slo="cleanup.run"}'
