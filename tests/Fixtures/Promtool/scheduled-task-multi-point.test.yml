# nightly.jobs: one scheduled-task SLO on a service task and a command task (task=~ alternation), deadline 2m, 3d
# window. Rules are generated by PromtoolTest next to this file.
rule_files:
  - prometheus/slo-recording.rules.yml
  - prometheus/slo-alerts.rules.yml

evaluation_interval: 1m

tests:
  - name: killed run of the service task
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\NightlyTask::__invoke"}'
        values: '100x9 101x60'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\NightlyTask::__invoke",outcome="success"}'
        values: '100x70'
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="command:app:nightly"}'
        values: '50x70'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="command:app:nightly",outcome="success"}'
        values: '50x70'
    promql_expr_test:
      - expr: slo:error_ratio:rate5m{slo="nightly.jobs"}
        eval_time: 13m
        exp_samples:
          - labels: 'slo:error_ratio:rate5m{application="shop",objective="availability",revision="e16395ab",slo="nightly.jobs",window="3d"}'
            value: 1

  - name: killed run of the command task
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\NightlyTask::__invoke"}'
        values: '100x70'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="App\\Task\\NightlyTask::__invoke",outcome="success"}'
        values: '100x70'
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="command:app:nightly"}'
        values: '50x9 51x60'
      - series: 'symfony_slo_scheduled_task_finished_total{application="shop",component="worker",task="command:app:nightly",outcome="success"}'
        values: '50x70'
    promql_expr_test:
      - expr: slo:error_ratio:rate5m{slo="nightly.jobs"}
        eval_time: 13m
        exp_samples:
          - labels: 'slo:error_ratio:rate5m{application="shop",objective="availability",revision="e16395ab",slo="nightly.jobs",window="3d"}'
            value: 1

  # Every run dies: no event series ever exists, yet the started runs cover the window and the ticket alert fires.
  - name: task that always dies covers its window and burns the budget
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\NightlyTask::__invoke"}'
        values: '0+1x4400'
    promql_expr_test:
      - expr: slo:window:coverage_ratio{slo="nightly.jobs"}
        eval_time: 3d1h
        exp_samples:
          - labels: 'slo:window:coverage_ratio{application="shop",objective="availability",revision="e16395ab",slo="nightly.jobs",window="3d"}'
            value: 1
      - expr: slo:sli:ratio{slo="nightly.jobs"}
        eval_time: 3d1h
        exp_samples:
          - labels: 'slo:sli:ratio{application="shop",objective="availability",revision="e16395ab",slo="nightly.jobs",window="3d"}'
            value: 0
    alert_rule_test:
      - eval_time: 3d1h
        alertname: SloErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              application: shop
              objective: availability
              revision: e16395ab
              severity: page
              slo: nightly.jobs
              window: 3d
            exp_annotations:
              summary: 'SLO nightly.jobs availability burns its error budget fast (target 99%, window 3d)'
          - exp_labels:
              application: shop
              objective: availability
              revision: e16395ab
              severity: ticket
              slo: nightly.jobs
              window: 3d
            exp_annotations:
              summary: 'SLO nightly.jobs availability burns its error budget (target 99%, window 3d)'

  # The pod serving the counters is replaced at 2000m: neither series lives for the 3d window, the step record does.
  - name: task that always dies across a pod replacement burns the 3d budget
    interval: 1m
    input_series:
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\NightlyTask::__invoke",instance="a"}'
        values: '0+1x2000 stale'
      - series: 'symfony_slo_scheduled_task_started_total{application="shop",component="worker",task="App\\Task\\NightlyTask::__invoke",instance="b"}'
        values: '_x2000 2001+1x2400'
    promql_expr_test:
      - expr: slo:error_ratio:rate3d{slo="nightly.jobs"}
        eval_time: 3d1h
        exp_samples:
          - labels: 'slo:error_ratio:rate3d{application="shop",objective="availability",revision="e16395ab",slo="nightly.jobs",window="3d"}'
            value: 1
      - expr: slo:sli:ratio{slo="nightly.jobs"}
        eval_time: 3d1h
        exp_samples:
          - labels: 'slo:sli:ratio{application="shop",objective="availability",revision="e16395ab",slo="nightly.jobs",window="3d"}'
            value: 0
    alert_rule_test:
      - eval_time: 3d1h
        alertname: SloErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              application: shop
              objective: availability
              revision: e16395ab
              severity: page
              slo: nightly.jobs
              window: 3d
            exp_annotations:
              summary: 'SLO nightly.jobs availability burns its error budget fast (target 99%, window 3d)'
          - exp_labels:
              application: shop
              objective: availability
              revision: e16395ab
              severity: ticket
              slo: nightly.jobs
              window: 3d
            exp_annotations:
              summary: 'SLO nightly.jobs availability burns its error budget (target 99%, window 3d)'
