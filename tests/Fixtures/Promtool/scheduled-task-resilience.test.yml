# Healthy cleanup.run (deadline 2m): a run every 10m from 10m, finished 1m later; the counters carry 3 runs killed
# long ago (started 103, finished 100). Resets, outages and replica churn may lose the detection of unfinished runs
# for up to d+r, but never report a bad event or page.
rule_files:
  - ../Generated/prometheus/slo-recording.rules.yml
  - ../Generated/prometheus/slo-alerts.rules.yml

evaluation_interval: 1m

tests:
  # Redis flush at 125m: within (t-d, t] at 125m-127m, within [t-d-r, t-d] at 128m-132m.
